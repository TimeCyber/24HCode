name: codeassist_mobile
description: CodeAssist remote client for Cursor/Codex tasks and prompts.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  web_socket_channel: ^3.0.2
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.4
  flutter_foreground_task: ^11.0.3
  open_filex: ^5.0.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
